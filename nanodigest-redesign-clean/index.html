<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nano Digest — Discover ideas, breakthroughs, and perspectives shaping nanotechnology." />
    <meta name="theme-color" content="#f6f8f5" />
    <title>Nano Digest — Small Science. Limitless Impact.</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const params = new URLSearchParams(window.location.search)
      const route = params.get('p')
      if (route !== null) {
        const base = '%BASE_URL%'
        const query = params.get('q')
        const hash = params.get('h')
        const restoredPath = `${base}${route.replace(/^\/+/, '')}`
        window.history.replaceState(
          null,
          '',
          `${restoredPath}${query ? `?${query}` : ''}${hash ? `#${hash}` : ''}`,
        )
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
