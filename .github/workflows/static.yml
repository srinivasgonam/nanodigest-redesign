name: Deploy NanoDigest to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nanodigest-redesign-clean/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: nanodigest-redesign-clean

      - name: Build website
        run: npm run build
        working-directory: nanodigest-redesign-clean
        env:
          # Optional: set a repository variable named VITE_FORMS_API_URL to enable form submissions.
          VITE_FORMS_API_URL: ${{ vars.VITE_FORMS_API_URL }}
          # Optional Google AdSense settings (repository variables); leave unset for no ads.
          VITE_ADSENSE_CLIENT: ${{ vars.VITE_ADSENSE_CLIENT }}
          VITE_ADSENSE_SLOT_LEADERBOARD: ${{ vars.VITE_ADSENSE_SLOT_LEADERBOARD }}
          VITE_ADSENSE_SLOT_IN_ARTICLE: ${{ vars.VITE_ADSENSE_SLOT_IN_ARTICLE }}
          VITE_ADSENSE_SLOT_SIDEBAR: ${{ vars.VITE_ADSENSE_SLOT_SIDEBAR }}
          VITE_SHOW_AD_PLACEHOLDERS: ${{ vars.VITE_SHOW_AD_PLACEHOLDERS }}

      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: nanodigest-redesign-clean/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
